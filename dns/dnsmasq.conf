# DNS anti-poison for NDMS routers (Entware dnsmasq-full) -> /opt/etc/dnsmasq.conf
# LAN clients' DNS (port 53) is DNAT-ed here by ndm/netfilter.d/20-dns-split.sh.
# Foreign names are resolved by the VPS resolver through the tunnel (not poisoned by the ISP);
# Russian zones go directly to Yandex. Upstream list lives in dnsmasq.servers
# (rewritten by dns-failover.sh when the tunnel is down).
port=5354
# router LAN IP (second address) must match IP in 20-dns-split.sh
listen-address=127.0.0.1,192.168.1.1
bind-interfaces
no-resolv
no-poll
strict-order
cache-size=1000
servers-file=/opt/etc/dnsmasq.servers
server=/ru/77.88.8.8
server=/su/77.88.8.8
server=/xn--p1ai/77.88.8.8
